<section
  class="rounded-2xl border border-danger/30 bg-danger-soft px-5 py-10 text-center sm:px-8"
  role="alert"
>
  <span
    class="mx-auto mb-4 flex size-14 items-center justify-center rounded-full bg-danger/15 text-danger"
    aria-hidden="true"
  >
    <mat-icon>error_outline</mat-icon>
  </span>
  <h3 class="text-lg font-bold text-ink">{{ title() }}</h3>
  <p class="mx-auto mt-2 max-w-md text-sm text-muted">{{ message() }}</p>
  <button
    type="button"
    class="mt-5 rounded-full bg-danger px-5 py-2 text-sm font-semibold text-white transition hover:opacity-90"
    (click)="retry.emit()"
  >
    Reintentar
  </button>
</section>

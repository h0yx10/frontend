<section
  class="rounded-2xl border border-dashed border-border bg-surface px-5 py-14 text-center shadow-sm sm:px-8 sm:py-20"
>
  <span
    class="mx-auto mb-4 flex size-14 items-center justify-center rounded-full bg-primary/15 text-accent"
    aria-hidden="true"
  >
    <mat-icon>{{ icon() }}</mat-icon>
  </span>
  <h3 class="text-lg font-bold text-ink sm:text-xl">{{ title() }}</h3>
  <p class="mx-auto mt-2 max-w-md text-sm text-muted sm:text-base">
    {{ message() }}
  </p>
  <div class="mt-5">
    <ng-content />
  </div>
</section>

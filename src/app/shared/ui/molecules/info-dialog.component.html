<app-modal titleId="info-dialog-title" [heading]="heading()" size="sm" (closed)="accepted.emit()">
  <p class="text-sm text-muted">{{ message() }}</p>

  <div class="mt-6 flex justify-start">
    <button
      type="button"
      class="rounded-full bg-primary px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-dark"
      (click)="accepted.emit()"
    >
      {{ acceptLabel() }}
    </button>
  </div>
</app-modal>

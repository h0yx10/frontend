<div>
  @if (label()) {
    <p class="mb-1.5 text-xs font-medium text-muted">{{ label() }}</p>
  }
  <div
    class="h-2 w-full overflow-hidden rounded-full bg-surface"
    role="progressbar"
    [attr.aria-valuenow]="clamped()"
    aria-valuemin="0"
    aria-valuemax="100"
  >
    <div
      class="h-full rounded-full transition-all duration-500"
      [class]="fillClass()"
      [style.width.%]="clamped()"
    ></div>
  </div>
</div>

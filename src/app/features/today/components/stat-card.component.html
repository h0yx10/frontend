<div class="flex min-w-0 items-center gap-3 rounded-xl border border-border bg-surface px-3 py-2.5">
  <p class="font-mono text-[10px] font-semibold uppercase tracking-wide text-muted">
    {{ label() }}
  </p>
  <p class="text-xl font-extrabold leading-none" [class]="valueClass()">{{ value() }}</p>
  @if (hint()) {
    <p class="hidden text-[10px] text-muted 2xl:block">{{ hint() }}</p>
  }
</div>

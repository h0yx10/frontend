<div class="flex h-full min-w-0 items-center gap-4 rounded-2xl border border-border bg-surface px-5 py-4">
  <p class="shrink-0 text-4xl font-bold leading-none tabular-nums" [class]="valueClass()">{{ value() }}</p>
  <div class="min-w-0">
    <p class="text-sm font-semibold text-ink">{{ label() }}</p>
    @if (hint()) {
      <p class="mt-0.5 text-xs leading-snug text-muted">{{ hint() }}</p>
    }
  </div>
</div>

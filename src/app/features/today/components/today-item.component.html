<article
  class="flex flex-col gap-2 rounded-lg border border-border border-l-4 bg-surface-raised/60 p-2.5"
  [class]="borderClass()"
>
  <div class="flex items-start gap-2">
    <span
      class="mt-1 flex size-4 shrink-0 items-center justify-center rounded border border-border bg-canvas"
      [class.border-success]="subtask().status === 'DONE'"
      [class.bg-success-soft]="subtask().status === 'DONE'"
      aria-hidden="true"
    >
      @if (subtask().status === 'DONE') {
        <mat-icon class="text-[13px] text-success">check</mat-icon>
      }
    </span>
    <div class="min-w-0 flex-1">
      <p class="truncate text-xs font-semibold text-ink">{{ subtask().name }}</p>
      <div class="mt-0.5 flex flex-wrap items-center gap-1.5">
        <app-status-badge [label]="dateBadge().label" [tone]="dateBadge().tone" />
        <span class="text-[11px] text-muted">{{ subtask().estimatedHours }} h</span>
      </div>
    </div>
  </div>
  @if (subtask().status === 'POSTPONED') {
    <p class="text-[11px] font-medium text-warning">Pospuesta</p>
  }

  <div class="flex flex-wrap gap-1.5">
    <button
      type="button"
      class="rounded-md bg-success-soft px-2.5 py-1 text-[11px] font-semibold text-success transition hover:opacity-90"
      (click)="markDone.emit(subtask())"
    >
      Hecha
    </button>
    @if (bucket() === 'TODAY') {
      <button
        type="button"
        class="rounded-md border border-border px-2.5 py-1 text-[11px] font-semibold text-ink transition hover:bg-surface-raised"
        (click)="postpone.emit(subtask())"
      >
        Posponer
      </button>
    }
    <button
      type="button"
      class="rounded-md border border-primary px-2.5 py-1 text-[11px] font-semibold text-accent transition hover:bg-primary/10"
      (click)="reschedule.emit(subtask())"
    >
      Reprogramar
    </button>
  </div>
</article>

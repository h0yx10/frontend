<article
  class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-2 rounded-lg border border-border bg-surface-raised/60 px-2.5 py-2"
  [class]="borderClass()"
>
  <span
    class="flex size-4 shrink-0 items-center justify-center rounded border border-border bg-canvas"
    [class.border-border]="subtask().status === 'DONE'"
    [class.bg-success-soft]="subtask().status === 'DONE'"
    aria-hidden="true"
  >
    @if (subtask().status === 'DONE') {
      <mat-icon class="text-[13px] text-success">check</mat-icon>
    }
  </span>
  <div class="min-w-24 flex-1">
    <p class="flex min-w-0 items-center gap-1.5 text-xs font-semibold text-ink">
      <span class="truncate" [attr.title]="subtask().name">{{ subtask().name }}</span>
      @if (subtask().status === 'POSTPONED') {
        <span class="shrink-0 rounded-full bg-warning-warm/10 px-1.5 py-0.5 text-[10px] font-medium text-warning-warm">Pospuesta</span>
      }
    </p>
    <div class="mt-0.5 flex flex-wrap items-center gap-x-1.5">
      <app-status-badge [label]="dateBadge().label" [tone]="dateBadge().tone" />
      <span class="text-[11px] text-muted">{{ subtask().estimatedHours }} h</span>
    </div>
  </div>
  <div class="ml-auto flex shrink-0 items-center gap-1">
    <button
      type="button"
      aria-label="Marcar como hecha"
      title="Marcar como hecha"
      class="relative inline-flex h-8 min-w-8 shrink-0 items-center justify-center whitespace-nowrap rounded-lg bg-success-muted/10 px-2 text-[11px] font-semibold text-success-muted transition hover:bg-success-muted/20"
      (click)="markDone.emit(subtask())"
    >
      <mat-icon class="today-action-icon text-[16px]" aria-hidden="true">check</mat-icon>
      <span class="today-action-label">Hecha</span>
    </button>
    @if (bucket() === 'TODAY') {
      <button
        type="button"
        aria-label="Posponer subtarea"
        title="Posponer subtarea"
        class="relative inline-flex h-8 min-w-8 shrink-0 items-center justify-center whitespace-nowrap rounded-lg border border-border px-2 text-[11px] font-semibold text-ink transition hover:bg-surface-raised"
        (click)="postpone.emit(subtask())"
      >
        <mat-icon class="today-action-icon text-[16px]" aria-hidden="true">schedule</mat-icon>
        <span class="today-action-label">Posponer</span>
      </button>
    }
    <button
      type="button"
      aria-label="Reprogramar subtarea"
      title="Reprogramar subtarea"
      class="relative inline-flex h-8 min-w-8 shrink-0 items-center justify-center whitespace-nowrap rounded-lg border border-border px-2 text-[11px] font-semibold text-accent transition hover:bg-primary/10"
      (click)="reschedule.emit(subtask())"
    >
      <mat-icon class="today-action-icon text-[16px]" aria-hidden="true">event_repeat</mat-icon>
      <span class="today-action-label">Reprogramar</span>
    </button>
  </div>
</article>

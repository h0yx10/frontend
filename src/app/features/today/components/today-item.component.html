<article
  class="flex flex-col gap-3 rounded-xl border border-border border-l-4 bg-surface p-4"
  [class]="borderClass()"
>
  <app-status-badge [label]="dateBadge().label" [tone]="dateBadge().tone" />

  <div>
    <p class="font-semibold text-ink">{{ subtask().name }}</p>
    <p class="mt-0.5 text-xs text-muted">{{ subtask().eventName }} · {{ subtask().estimatedHours }} h</p>
    @if (subtask().status === 'POSTPONED') {
      <p class="mt-1 text-xs font-medium text-warning">Pospuesta</p>
    }
  </div>

  <div class="flex flex-wrap gap-2">
    <button
      type="button"
      class="rounded-lg bg-success-soft px-3 py-1.5 text-xs font-semibold text-success transition hover:opacity-90"
      (click)="markDone.emit(subtask())"
    >
      Hecha
    </button>
    @if (bucket() === 'TODAY') {
      <button
        type="button"
        class="rounded-lg border border-border px-3 py-1.5 text-xs font-semibold text-ink transition hover:bg-surface-raised"
        (click)="postpone.emit(subtask())"
      >
        Posponer
      </button>
    }
    <button
      type="button"
      class="rounded-lg border border-primary px-3 py-1.5 text-xs font-semibold text-accent transition hover:bg-primary/10"
      (click)="reschedule.emit(subtask())"
    >
      Reprogramar
    </button>
  </div>
</article>

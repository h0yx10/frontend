<article class="rounded-xl border border-border bg-surface" [class]="accentClass()">
  <div class="flex items-start gap-3 p-3">
    <app-check-button
      class="mt-0.5"
      [checked]="subtask().status === 'DONE'"
      [label]="'Marcar hecha: ' + subtask().name"
      (toggled)="markDone.emit(subtask())"
    />
    <div class="min-w-0 flex-1">
      <p class="flex min-w-0 items-center gap-2 text-sm font-semibold text-ink">
        <span class="truncate" [attr.title]="subtask().name">{{ subtask().name }}</span>
        @if (subtask().status === 'POSTPONED') {
          <span class="shrink-0 rounded-full bg-warning-soft px-2 py-0.5 text-[10px] font-semibold text-warning">Pospuesta</span>
        }
      </p>
      <div class="mt-1.5 flex flex-wrap items-center gap-2">
        <app-status-badge [label]="dateBadge().label" [tone]="dateBadge().tone" />
        <span class="text-xs text-muted tabular-nums">{{ subtask().estimatedHours }} h</span>
      </div>
    </div>
  </div>
  <div class="flex items-center justify-end gap-2 border-t border-border px-3 py-2">
    @if (bucket() === 'TODAY') {
      <button
        type="button"
        aria-label="Posponer gestión"
        title="Posponer"
        class="flex size-9 items-center justify-center rounded-lg border border-border text-muted transition hover:bg-surface-raised hover:text-ink"
        (click)="postpone.emit(subtask())"
      >
        <mat-icon class="text-[18px]" aria-hidden="true">schedule</mat-icon>
      </button>
    }
    <button
      type="button"
      aria-label="Reprogramar gestión"
      title="Reprogramar"
      class="flex size-9 items-center justify-center rounded-lg border border-border text-muted transition hover:bg-surface-raised hover:text-ink"
      (click)="reschedule.emit(subtask())"
    >
      <mat-icon class="text-[18px]" aria-hidden="true">calendar_today</mat-icon>
    </button>
  </div>
</article>

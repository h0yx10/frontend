<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <app-event-details-fields [errors]="errors()" [minDate]="minDate" />

  <div class="mt-8 flex items-center justify-end gap-3 border-t border-border pt-6">
    @if (showCancel()) {
      <button type="button" class="btn-ghost" (click)="cancel.emit()">Cancelar</button>
    }
    <button type="submit" class="btn-primary h-12 px-6" [disabled]="saving()">
      {{ saving() ? 'Guardando…' : submitLabel() }}
    </button>
  </div>
</form>

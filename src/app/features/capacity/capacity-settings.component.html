<form class="mt-4 border-t border-border pt-4" (ngSubmit)="save()" novalidate>
  <label for="capacity-limit" class="block text-sm font-semibold text-ink">Límite diario</label>
  <div class="mt-2 flex items-center gap-2">
    <input
      id="capacity-limit"
      name="limit"
      type="number"
      inputmode="decimal"
      [min]="min"
      [max]="max"
      step="0.5"
      [ngModel]="hours()"
      (ngModelChange)="onHoursChange($event)"
      class="min-w-0 flex-1 rounded-xl border border-border bg-canvas px-3 py-2 text-center text-lg font-bold text-ink tabular-nums"
      [class.border-danger]="!!validationError() || !!store.error()"
      [attr.aria-invalid]="!!validationError() || !!store.error()"
      aria-describedby="capacity-help capacity-error"
    />
    <span class="shrink-0 text-sm text-muted">h/día</span>
  </div>
  <p id="capacity-help" class="mt-1.5 text-xs text-muted">Entre {{ min }} y {{ max }} horas.</p>

  @if (validationError() || store.error(); as message) {
    <p id="capacity-error" class="mt-2 flex items-start gap-1.5 text-xs text-danger" role="alert">
      <mat-icon class="mt-px shrink-0 text-[15px]" aria-hidden="true">error_outline</mat-icon>
      <span>{{ message }}</span>
    </p>
  }
  @if (suggestion(); as value) {
    <button
      type="button"
      class="mt-2 w-full rounded-xl border border-primary px-3 py-1.5 text-xs font-semibold text-accent transition hover:bg-primary/10"
      (click)="useSuggestion()"
    >
      Usar {{ value }} h
    </button>
  }

  <button
    type="submit"
    class="btn-primary mt-3 flex h-10 w-full items-center justify-center gap-1.5"
    [disabled]="!changed() || !!validationError() || store.saving()"
  >
    <mat-icon class="text-[18px]" aria-hidden="true">save</mat-icon>
    {{ store.saving() ? 'Guardando…' : 'Guardar' }}
  </button>
</form>
